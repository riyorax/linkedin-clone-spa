services:
  db:
      image: postgres:latest
      container_name: wbd_postgres
      env_file:
        - ./backend/.env
      ports:
        - 5432:5432
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
        interval: 10s
        timeout: 5s
        retries: 5
