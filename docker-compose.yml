services:
  db:
    image: postgres:latest
    container_name: wbd_postgres
    env_file:
      - ./backend/.env
    ports:
      - 5432:5432
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: wbd_backend
    env_file:
      - ./backend/.env
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push &&
             npm run start"
  frontend:
    build:
      context: ./frontend
    container_name: wbd_frontend
    env_file:
      - ./frontend/.env
    ports:
      - 3001:80
    depends_on:
      - backend
  # redis:
  #   image: redis:latest
